name: Voice mode live

# Real round trips through the voice mode providers (crates/voice/src/call/live.rs).
# Needs the OPENROUTER_API_KEY repository secret; DEEPGRAM_API_KEY and
# MISTRAL_API_KEY are optional. Without the OpenRouter key the job only says so.
on:
  pull_request:
    paths:
      - 'crates/voice/src/call/**'
      - 'crates/voice/src/cloud.rs'
      - '.github/workflows/voice-live.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - name: Check for the OpenRouter key
        id: key
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::notice::Add the OPENROUTER_API_KEY repository secret to run the voice mode live tests."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.key.outputs.present == 'true'
        uses: ./.github/actions/linux-ci
        with:
          rust-cache: voice-live
          apt-cache: voice-live
          apt-packages: libasound2-dev pkg-config
      - name: Speak, hear and reply through the real providers
        if: steps.key.outputs.present == 'true'
        run: cargo test --locked -p zeron-voice --lib call::live -- --ignored --nocapture --test-threads=1
